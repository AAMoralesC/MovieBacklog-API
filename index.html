<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movie Backlog</title>
    <style>
        :root { --primary: #6200ee; --danger: #cf6679; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 40px auto; background: #f8f9fa; color: #333; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button.btn-add { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .movie-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .movie-item:hover { background: #fcfcfc; }
        .movie-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .movie-title.completed { text-decoration: line-through; color: #888; }
        
        .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }
        input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="container">
    <h1>🎬 Mi Movie Backlog</h1>
    <p id="counter" style="color: #666; font-weight: bold; margin-bottom: 20px;"></p>
    
    <div class="input-group">
        <input type="text" id="movieTitle" placeholder="Nombre de la película...">
        <button class="btn-add" onclick="addMovie()">Añadir</button>
    </div>

    <div id="movieList">
        </div>
</div>

<script>
    const API_URL = 'http://localhost:5087/movies'; // VERIFICA TU PUERTO AQUÍ

    // READ: Cargar películas al iniciar
    async function loadMovies() {
        try {
            const res = await fetch(API_URL);
            const movies = await res.json();
            renderMovies(movies);
        } catch (err) {
            console.error("Error cargando BD:", err);
        }
    }

    function renderMovies(movies) {
    const list = document.getElementById('movieList');
    const counter = document.getElementById('counter');

    // --- Lógica del contador ---
    // Sacamos el total de pelis que vienen de la base de datos
    const total = movies.length;
    // Filtramos las que ya están marcadas como true en 'watched'
    const watchedCount = movies.filter(m => m.watched).length;
    const pendingCount = total - watchedCount;

    // Actualizamos el texto del contador arriba de la lista
    if (total === 0) {
        counter.innerHTML = "No hay pelis aún. ¡Agrega una!";
    } else {
        counter.innerHTML = `Total: ${total} | Vistas: ${watchedCount} | Pendientes: ${pendingCount}`;
    }

    // --- Dibujar la lista ---
    // Limpiamos el div antes de volver a llenarlo para que no se dupliquen
    list.innerHTML = '';

    if (total === 0) {
        list.innerHTML = '<p style="text-align:center; color:#999;">Vacío...</p>';
        return; 
    }

    // Recorremos el array de pelis que nos mandó el servidor
    movies.forEach(m => {
        // Creamos el HTML de cada fila con sus botones y el checkbox
        list.innerHTML += `
            <div class="movie-item">
                <div class="movie-info">
                    <input type="checkbox" ${m.watched ? 'checked' : ''} 
                           onchange="toggleWatched(${m.id}, '${m.title}', ${m.watched})">
                    
                    <span class="movie-title ${m.watched ? 'completed' : ''}">${m.title}</span>
                </div>
                
                <button class="btn-delete" onclick="deleteMovie(${m.id})">🗑️</button>
            </div>`;
    });
}

    // CREATE: Añadir nueva
    async function addMovie() {
        const input = document.getElementById('movieTitle');
        if (!input.value.trim()) return;

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: input.value, watched: false })
        });
        input.value = '';
        loadMovies();
        Swal.fire({
            icon: 'success',
            title: '¡Añadida!',
            text: 'Película guardada en el backlog',
            showConfirmButton: false,
            timer: 1500,
            width: '300px', // Tamaño fijo pequeño para que no ocupe toda la pantalla
            padding: '2em',
            color: '#716add',
            backdrop: `rgba(0,0,123,0.1)` // Un fondo suave para centrar la atención
        });
    }

    // UPDATE: Cambiar estado Vista/Pendiente
    async function toggleWatched(id, title, currentStatus) {
        await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, title: title, watched: !currentStatus })
        });
        loadMovies();
    }

    // DELETE: Eliminar de la BD con estilo
    async function deleteMovie(id) {
    // Usamos SweetAlert en lugar del confirm feo del navegador
    Swal.fire({
        title: '¿Estás seguro?',
        text: "¡No podrás revertir esto!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#6200ee',
        cancelButtonColor: '#cf6679',
        confirmButtonText: 'Sí, borrar',
        cancelButtonText: 'Cancelar'
    }).then(async (result) => {
        // Si el usuario hizo clic en el botón de confirmar
        if (result.isConfirmed) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                
                // Mostramos un mensaje de éxito rápido
                Swal.fire({
                    title: '¡Borrada!',
                    text: 'La película ha sido eliminada.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                });

                loadMovies(); // Recargamos la lista
            } catch (err) {
                Swal.fire('Error', 'No se pudo borrar la peli', 'error');
            }
        }
    });
}

    // Ejecutar al cargar la página
    loadMovies();
</script>

</body>
</html>
